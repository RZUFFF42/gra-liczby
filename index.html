<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra w klikanie liczb</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
        }
        h1 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 5px;
            text-align: center;
        }
        #info {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #cccccc;
        }
        #grid {
            display: grid;
            grid-template-columns: repeat(5, 55px);
            grid-gap: 8px;
            margin-bottom: 20px;
        }
        .cell {
            width: 55px;
            height: 55px;
            background-color: #ff0000;
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .cell.hidden {
            background-color: #222222;
            color: #444444;
            pointer-events: none;
        }
        #restart {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Znajdź liczby od 1 do 25</h1>
    <div id="info">Czas: <span id="timer">0.0</span> s | Szukaj: <span id="target" style="color: #ff4444; font-weight: bold;">1</span></div>
    
    <div id="grid"></div>
    
    <button id="restart" onclick="startGame()">Od nowa</button>

    <script>
        const grid = document.getElementById('grid');
        const timerDisplay = document.getElementById('timer');
        const targetDisplay = document.getElementById('target');
        
        let numbers = [];
        let currentTarget = 1;
        let startTime = null;
        let timerInterval = null;
        let isPlaying = false;

        function startGame() {
            grid.innerHTML = '';
            currentTarget = 1;
            targetDisplay.textContent = currentTarget;
            clearInterval(timerInterval);
            timerDisplay.textContent = '0.0';
            isPlaying = true;

            numbers = Array.from({ length: 25 }, (_, i) => i + 1);
            numbers.sort(() => Math.random() - 0.5);

            numbers.forEach(num => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.textContent = num;
                cell.addEventListener('click', () => handleCellClick(num, cell));
                grid.appendChild(cell);
            });

            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                timerDisplay.textContent = elapsed.toFixed(1);
            }, 100);
        }

        function handleCellClick(num, cellElement) {
            if (!isPlaying) return;

            if (num === currentTarget) {
                cellElement.classList.add('hidden');
                cellElement.textContent = '';
                currentTarget++;

                if (currentTarget > 25) {
                    clearInterval(timerInterval);
                    isPlaying = false;
                    alert(`Gratulacje! Twój czas to: ${timerDisplay.textContent} s`);
                } else {
                    targetDisplay.textContent = currentTarget;
                }
            }
        }

        startGame();
    </script>
</body>
</html>
